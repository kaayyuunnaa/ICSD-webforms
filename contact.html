<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DevStudent</a>
            <div class="navbar-nav">
                <a class="nav-link" href="signup.html">Sign Up</a>
                <a class="nav-link" href="signin.html">Sign In</a>
                <a class="nav-link" href="blog.html">Blog</a>
                <a class="nav-link active" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="row g-5">
            <div class="col-md-6">
                <h2>Get in Touch</h2>
                <p>Fill out the form and our team will get back to you within 24 hours.</p>
                <form>
                    <div class="mb-3">
                        <label class="form-label">Your Name</label>
                        <input type="text" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email Address</label>
                        <input type="email" class="form-control">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Message</label>
                        <textarea class="form-control" rows="4"></textarea>
                    </div>
                    <button type="submit" class="btn btn-dark">Send Message</button>
                </form>
            </div>
            <div class="col-md-6">
                <div class="h-100 p-5 bg-white border rounded-3 shadow-sm text-center">
                    <h4>Our Office</h4>
                    <p>Strathmore University<br>Madarake, Nairobi</p>
                    <hr>
                    <p><strong>Support:</strong> ICS2.1support@strathmore.edu</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
