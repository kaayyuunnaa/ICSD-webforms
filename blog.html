<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Blog Post</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">DevStudent</a>
            <div class="navbar-nav">
                <a class="nav-link" href="signup.html">Sign Up</a>
                <a class="nav-link" href="signin.html">Sign In</a>
                <a class="nav-link active" href="blog.html">Blog</a>
                <a class="nav-link" href="contact.html">Contact</a>
            </div>
        </div>
    </nav>

    <div class="container mt-5">
        <div class="card shadow-lg p-5">
            <h2 class="mb-4">New Blog Post</h2>
            <form>
                <div class="mb-3">
                    <label class="form-label">Post Title</label>
                    <input type="text" class="form-control" placeholder="The Future of Bootstrap">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Category</label>
                        <select class="form-select">
                            <option>Tech</option>
                            <option>Design</option>
                            <option>Education</option>
                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Header Image</label>
                        <input type="file" class="form-control">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Content</label>
                    <textarea class="form-control" rows="8"></textarea>
                </div>
                <button type="submit" class="btn btn-primary px-5">Publish Now</button>
            </form>
        </div>
    </div>
</body>
</html>
